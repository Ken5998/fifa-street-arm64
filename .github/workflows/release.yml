name: Launcher release

# Publishes the launcher for ARM64 Linux as release vVERSION (the version in
# launcher/Cargo.toml). The launcher holds no game files and no build
# scripts: on the device it fetches this repository's scripts and patches and
# builds the game from the player's own disc.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launcher:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust
        run: |
          command -v cargo || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build and pack the launcher
        run: scripts/package-launcher.sh out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=out/FifaStreet-Launcher-linux-arm64.tar.gz
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' launcher/Cargo.toml | head -1)"
          sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          scripts/release-notes.sh "v$version" > notes.md
          cat >> notes.md <<NOTES
          ## Kick-off

          You need FIFA Street (2012, Xbox 360) as a disc image and about 30 GB free on the handheld.

          - In Desktop Mode, unpack FifaStreet-Launcher-linux-arm64.tar.gz, start FifaStreet/fifastreet-launcher and press **Build** once it has spotted your disc image (**Browse...** if it hasn't).
          - The ReStreet recompilation is compiled right there on the device, so keep it on the charger. FIFA Street then shows up in Steam.
          - For later releases, **Update** pulls the fixes and recompiles only what they touch.

          Settings are in game/fifastreet.toml, preset for the Retroid Pocket 6 (1280 x 720, aiming at 60 fps). Overlay flickering? **Turn it off** in the launcher disables GPU preemption; restart afterwards.

          Launcher SHA-256: \`$sha256\`. The game itself is not included.
          NOTES
          if gh release view "v$version" > /dev/null 2>&1; then
            gh release upload "v$version" "$archive" --clobber
            gh release edit "v$version" --notes-file notes.md
          else
            gh release create "v$version" "$archive" --title "FIFA Street launcher $version for ARM64 Linux" \
              --notes-file notes.md --target "$GITHUB_SHA"
          fi
